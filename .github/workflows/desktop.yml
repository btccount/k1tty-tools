name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS'
        type: choice
        options: [all, windows, linux, macos]
        default: all
        required: true
      build_mode:
        description: 'Build flavor: debug (DEV) or production'
        type: choice
        options: [production, debug]
        default: production
        required: true
  push:
    branches: [main, 'migration/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target_os }} (${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'debug' && 'DEV' || 'PROD' }})
    strategy:
      fail-fast: false
      matrix:
        target_os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_os != 'all' && format('["{0}"]', inputs.target_os) || '["windows","linux","macos"]') }}
    runs-on: ${{ matrix.target_os == 'windows' && 'windows-latest' || matrix.target_os == 'linux' && 'ubuntu-22.04' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev patchelf
      - name: Add both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target_os }}
      - run: npm ci
      - run: npm run check:ui
      - run: cargo fmt --all -- --check
      - run: cargo test -p k1tty-core
      - name: Build DEV installers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'debug' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run build -- --debug ${{ matrix.target_os == 'windows' && '--bundles nsis,msi' || matrix.target_os == 'linux' && '--bundles deb,appimage' || '--target universal-apple-darwin --bundles app,dmg' }}
      - name: Build PRODUCTION installers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode != 'debug' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run build -- ${{ matrix.target_os == 'windows' && '--bundles nsis,msi' || matrix.target_os == 'linux' && '--bundles deb,appimage' || '--target universal-apple-darwin --bundles app,dmg' }}
      - uses: actions/upload-artifact@v4
        with:
          name: k1tty-tools-${{ matrix.target_os }}-${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'debug' && 'dev' || 'prod' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/debug/bundle/**/*.deb
            target/debug/bundle/**/*.AppImage
            target/debug/bundle/**/*.exe
            target/debug/bundle/**/*.msi
            target/universal-apple-darwin/release/bundle/**/*.dmg
            target/universal-apple-darwin/debug/bundle/**/*.dmg

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Flatten release bundles
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release-files/ \;
          ls -lh release-files
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
